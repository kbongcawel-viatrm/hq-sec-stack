# Lab-only TheHive config placeholder.
# Production deployments should externalize secrets and use the official
# StrangeBee deployment templates for database, storage, TLS, and clustering.

play.http.secret.key = "CHANGE_ME_THEHIVE_LAB_SECRET_KEY_CHANGE_ME"
http.address = "0.0.0.0"
http.port = 9000

db.janusgraph {
  storage {
    backend = berkeleyje
    directory = "/opt/thp/thehive/data/db"
  }
}

storage.provider = localfs
storage.localfs.location = "/opt/thp/thehive/data/files"
