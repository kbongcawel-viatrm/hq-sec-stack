disable-conf: /suricata-update/disable.conf
enable-conf: /suricata-update/enable.conf
modify-conf: /suricata-update/modify.conf
drop-conf: /suricata-update/drop.conf

sources:
  - https://rules.emergingthreats.net/open/suricata-%(__version__)s/emerging.rules.tar.gz

local:
  - /local-rules/local.rules

ignore:
  - "*deleted.rules"

threshold-in: /suricata-update/threshold.config
