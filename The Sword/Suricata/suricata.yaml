%YAML 1.1
---
vars:
  address-groups:
    HOME_NET: "[10.77.0.0/24,192.168.0.0/16,172.16.0.0/12]"
    EXTERNAL_NET: "!$HOME_NET"
  port-groups:
    HTTP_PORTS: "80"
    SHELLCODE_PORTS: "!80"
    ORACLE_PORTS: 1521
    SSH_PORTS: 22

default-rule-path: /var/lib/suricata/rules
rule-files:
  - suricata.rules
  - local.rules

classification-file: /etc/suricata/classification.config
reference-config-file: /etc/suricata/reference.config

runmode: workers

stats:
  enabled: yes
  interval: 60

outputs:
  - fast:
      enabled: yes
      filename: fast.log
      append: yes
  - stats:
      enabled: yes
      filename: stats.log
      append: yes
      totals: yes
      threads: no
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      pcap-file: false
      community-id: true
      community-id-seed: 0
      xff:
        enabled: yes
        mode: extra-data
        deployment: reverse
        header: X-Forwarded-For
      types:
        - alert:
            tagged-packets: yes
            metadata: yes
        - anomaly:
            enabled: yes
            types:
              decode: yes
              stream: yes
              applayer: yes
        - dns:
            version: 2
            enabled: yes
            requests: yes
            responses: yes
        - http:
            extended: yes
        - tls:
            extended: yes
        - flow:
            enabled: yes
        - netflow:
            enabled: yes
        - files:
            force-magic: no
        - ssh
        - smtp:
            extended: yes
        - stats:
            totals: yes
            threads: no

app-layer:
  protocols:
    http:
      enabled: yes
    dns:
      tcp:
        enabled: yes
      udp:
        enabled: yes
    tls:
      enabled: yes
      ja3-fingerprints: yes
      ja4-fingerprints: yes
    ssh:
      enabled: yes
    smtp:
      enabled: yes

logging:
  default-log-level: notice
  outputs:
    - console:
        enabled: yes
    - file:
        enabled: yes
        filename: /var/log/suricata/suricata.log

af-packet:
  - interface: eth0
    cluster-id: 99
    cluster-type: cluster_flow
    defrag: yes
    use-mmap: yes
    tpacket-v3: yes
    checksum-checks: auto

detect:
  profile: medium
  custom-values:
    toclient-groups: 200
    toserver-groups: 200
  sgh-mpm-context: auto
  inspection-recursion-limit: 3000

stream:
  memcap: 128mb
  checksum-validation: yes
  reassembly:
    memcap: 256mb
    depth: 1mb
    toserver-chunk-size: 2560
    toclient-chunk-size: 2560

host-mode: auto
