---
- name: Isolate suspected Windows endpoint
  hosts: windows_targets
  gather_facts: false
  tasks:
    - name: Block outbound traffic by default
      ansible.windows.win_firewall_rule:
        name: HQSec Block Outbound
        direction: out
        action: block
        enabled: true
        profiles:
          - Domain
          - Private
          - Public
        remoteip: any

    - name: Allow management from SOC subnet
      ansible.windows.win_firewall_rule:
        name: HQSec Allow SOC Management
        direction: in
        action: allow
        enabled: true
        protocol: tcp
        localport: 5985
        remoteip: "{{ soc_subnet | default('10.77.0.0/24') }}"

    - name: Run Defender quick scan
      ansible.windows.win_shell: Start-MpScan -ScanType QuickScan

    - name: Stop suspicious service if provided
      ansible.windows.win_service:
        name: "{{ suspicious_service }}"
        state: stopped
      when: suspicious_service is defined
