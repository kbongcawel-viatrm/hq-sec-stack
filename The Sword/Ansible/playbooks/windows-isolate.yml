---
- name: Isolate suspected Windows endpoint
  hosts: windows_targets
  gather_facts: false
  vars:
    response_soc_subnet: "{{ soc_subnet | default('10.77.0.0/24') }}"
    winrm_ports:
      - 5985
      - 5986
  tasks:
    - name: Ensure HQSec response marker directory exists
      ansible.windows.win_file:
        path: C:\ProgramData\HQSec\Response
        state: directory

    - name: Record isolation start marker
      ansible.windows.win_powershell:
        parameters:
          ResponseSocSubnet: "{{ response_soc_subnet }}"
        script: |
          param([string]$ResponseSocSubnet)
          @"
          Isolation started by HQSec Ansible response.
          Time UTC: $((Get-Date).ToUniversalTime().ToString("o"))
          SOC subnet: $ResponseSocSubnet
          "@ | Set-Content -Path "C:\ProgramData\HQSec\Response\isolation-started.txt" -Encoding UTF8

    - name: Allow inbound WinRM management from SOC subnet before isolation
      ansible.windows.win_firewall_rule:
        name: "HQSec Allow SOC WinRM {{ item }}"
        direction: in
        action: allow
        enabled: true
        protocol: tcp
        localport: "{{ item }}"
        remoteip: "{{ response_soc_subnet }}"
        profiles:
          - Domain
          - Private
          - Public
      loop: "{{ winrm_ports }}"

    - name: Allow inbound ICMP from SOC subnet for reachability checks
      ansible.windows.win_firewall_rule:
        name: HQSec Allow SOC ICMP
        direction: in
        action: allow
        enabled: true
        protocol: icmpv4
        remoteip: "{{ response_soc_subnet }}"
        profiles:
          - Domain
          - Private
          - Public

    - name: Allow outbound traffic to SOC subnet for response tooling
      ansible.windows.win_firewall_rule:
        name: HQSec Allow Outbound SOC
        direction: out
        action: allow
        enabled: true
        remoteip: "{{ response_soc_subnet }}"
        profiles:
          - Domain
          - Private
          - Public

    - name: Set Windows Firewall profiles to default deny after SOC allow rules exist
      ansible.windows.win_powershell:
        script: |
          Set-NetFirewallProfile -Profile Domain,Private,Public `
            -DefaultInboundAction Block `
            -DefaultOutboundAction Block `
            -Enabled True

    - name: Run Defender quick scan
      ansible.windows.win_powershell:
        script: Start-MpScan -ScanType QuickScan
      ignore_errors: true

    - name: Stop suspicious service if provided
      ansible.windows.win_service:
        name: "{{ suspicious_service }}"
        state: stopped
      when: suspicious_service is defined

    - name: Record isolation completion marker
      ansible.windows.win_powershell:
        parameters:
          ResponseSocSubnet: "{{ response_soc_subnet }}"
        script: |
          param([string]$ResponseSocSubnet)
          @"
          Isolation completed by HQSec Ansible response.
          Time UTC: $((Get-Date).ToUniversalTime().ToString("o"))
          SOC subnet preserved: $ResponseSocSubnet
          "@ | Set-Content -Path "C:\ProgramData\HQSec\Response\isolation-completed.txt" -Encoding UTF8
