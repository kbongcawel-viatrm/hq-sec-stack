---
- name: Apply Windows AppLocker containment policy
  hosts: windows_targets
  gather_facts: false
  vars:
    applocker_enforcement_mode: "{{ applocker_mode | default('Enabled') }}"
  tasks:
    - name: Ensure HQSec response directory exists
      ansible.windows.win_file:
        path: C:\ProgramData\HQSec\Response
        state: directory

    - name: Copy HQSec AppLocker containment script
      ansible.windows.win_copy:
        src: ../../Windows/Applocker/HQSec-Containment-AppLocker.ps1
        dest: C:\ProgramData\HQSec\Response\HQSec-Containment-AppLocker.ps1

    - name: Apply HQSec AppLocker containment policy
      ansible.windows.win_powershell:
        parameters:
          EnforcementMode: "{{ applocker_enforcement_mode }}"
        script: |
          param([string]$EnforcementMode)
          & "C:\ProgramData\HQSec\Response\HQSec-Containment-AppLocker.ps1" -EnforcementMode $EnforcementMode
      register: applocker_containment_result

    - name: Record AppLocker containment Ansible result
      ansible.windows.win_copy:
        dest: C:\ProgramData\HQSec\Response\applocker-ansible-result.txt
        content: |
          AppLocker containment executed by HQSec Ansible response.
          Enforcement mode: {{ applocker_enforcement_mode }}
          Changed: {{ applocker_containment_result.changed }}
          Failed: {{ applocker_containment_result.failed | default(false) }}
