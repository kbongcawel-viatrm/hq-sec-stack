---
- name: Collect Windows incident artifacts
  hosts: windows_targets
  gather_facts: false
  tasks:
    - name: Create artifact directory
      ansible.windows.win_file:
        path: C:\ProgramData\HQSec\Artifacts
        state: directory

    - name: Export key event logs
      ansible.windows.win_shell: |
        wevtutil epl Microsoft-Windows-Sysmon/Operational C:\ProgramData\HQSec\Artifacts\sysmon.evtx
        wevtutil epl Microsoft-Windows-PowerShell/Operational C:\ProgramData\HQSec\Artifacts\powershell.evtx
        wevtutil epl Security C:\ProgramData\HQSec\Artifacts\security.evtx

    - name: Archive artifacts
      community.windows.win_zip:
        src: C:\ProgramData\HQSec\Artifacts\*
        dest: C:\ProgramData\HQSec\Artifacts.zip
