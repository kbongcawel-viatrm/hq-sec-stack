name: HQSec.Windows.PowerShellTriage
description: |
  PowerShell triage pack for alerts from Wazuh, Graylog, Sysmon, or the
  HQSec PowerShell fallback collector. Focuses on script block logs,
  transcription output, process creation, and local fallback evidence.

parameters:
  - name: LookbackDays
    default: 7
  - name: CommandRegex
    default: "(?i)(-enc|-encodedcommand|downloadstring|invoke-webrequest|invoke-restmethod|iex|invoke-expression|frombase64string|amsiutils|bypass|hidden|nop|add-mppreference|set-mppreference)"
  - name: TranscriptGlob
    default: "C:/ProgramData/HQSec/PowerShellLogs/**/*.txt"
  - name: FallbackJsonGlob
    default: "C:/ProgramData/HQSec/PowerShellLogs/*.jsonl"

sources:
  - name: PowerShellProcesses
    query: |
      SELECT Pid, Ppid, Name, Exe, CommandLine, Username, CreateTime
      FROM pslist()
      WHERE Exe =~ "(?i)(powershell|pwsh)\\.exe$" OR CommandLine =~ CommandRegex

  - name: PowerShellEventLogs
    query: |
      SELECT * FROM Artifact.Windows.EventLogs.EvtxHunter(
        EvtxGlob="C:/Windows/System32/winevt/Logs/Microsoft-Windows-PowerShell%4Operational.evtx",
        IocRegex=CommandRegex,
        DateAfter=timestamp(epoch=now() - LookbackDays * 86400))

  - name: SecurityProcessCreation
    query: |
      SELECT * FROM Artifact.Windows.EventLogs.EvtxHunter(
        EvtxGlob="C:/Windows/System32/winevt/Logs/Security.evtx",
        IocRegex="(?i)(powershell|pwsh|encodedcommand|downloadstring|invoke-expression)",
        DateAfter=timestamp(epoch=now() - LookbackDays * 86400))

  - name: SysmonPowerShellProcessCreation
    query: |
      SELECT * FROM Artifact.Windows.EventLogs.EvtxHunter(
        EvtxGlob="C:/Windows/System32/winevt/Logs/Microsoft-Windows-Sysmon%4Operational.evtx",
        IocRegex="(?i)(powershell|pwsh|encodedcommand|downloadstring|invoke-expression)",
        DateAfter=timestamp(epoch=now() - LookbackDays * 86400))

  - name: HQSecFallbackJsonl
    query: |
      SELECT FullPath, Size, Mtime, read_file(filename=FullPath, length=1048576) AS Sample
      FROM glob(globs=FallbackJsonGlob)

  - name: PowerShellTranscripts
    query: |
      SELECT FullPath, Size, Mtime, read_file(filename=FullPath, length=1048576) AS Sample
      FROM glob(globs=TranscriptGlob)
