name: HQSec.Windows.PersistenceAndTamper
description: |
  Hunt persistence locations and monitoring tamper indicators after
  Wazuh, Graylog, Sysmon, PowerShell, or Suricata alerts.

parameters:
  - name: LookbackDays
    default: 14
  - name: SuspiciousRegex
    default: "(?i)(wazuh|ossec|sysmon|eventlog|powershell|pwsh|encodedcommand|downloadstring|invoke-expression|startup|runonce|winlogon|defender|exclusion)"

sources:
  - name: Services
    query: |
      SELECT Name, DisplayName, State, StartMode, PathName, StartName
      FROM Artifact.Windows.System.Services()
      WHERE Name =~ SuspiciousRegex OR DisplayName =~ SuspiciousRegex OR PathName =~ SuspiciousRegex

  - name: ScheduledTasks
    query: |
      SELECT *
      FROM Artifact.Windows.System.TaskScheduler()
      WHERE Name =~ SuspiciousRegex OR Command =~ SuspiciousRegex OR Arguments =~ SuspiciousRegex

  - name: PowerShellProfiles
    query: |
      SELECT * FROM Artifact.Windows.Persistence.PowershellProfile()

  - name: Autoruns
    query: |
      SELECT * FROM Artifact.Windows.Sysinternals.Autoruns()
      WHERE Entry =~ SuspiciousRegex OR ImagePath =~ SuspiciousRegex OR Description =~ SuspiciousRegex

  - name: MonitoringInstallPaths
    query: |
      SELECT FullPath, Size, Mtime, Btime, Atime
      FROM glob(globs=[
        "C:/Program Files (x86)/ossec-agent/**",
        "C:/Program Files (x86)/Wazuh/**",
        "C:/Program Files/Sysmon/**",
        "C:/ProgramData/HQSec/PowerShellLogs/**"])

  - name: TamperEventLogs
    query: |
      SELECT * FROM Artifact.Windows.EventLogs.EvtxHunter(
        EvtxGlob="C:/Windows/System32/winevt/Logs/*.evtx",
        IocRegex=SuspiciousRegex,
        DateAfter=timestamp(epoch=now() - LookbackDays * 86400))
