name: HQSec.Windows.EndpointVisibility
description: |
  Endpoint visibility pack for live triage. Collects process, network,
  service, logged-on user, scheduled task, and recent autorun context.

parameters:
  - name: ProcessRegex
    default: "(?i)(powershell|pwsh|cmd|wscript|cscript|mshta|rundll32|regsvr32|certutil|bitsadmin|curl|wget|python)"
  - name: ServiceRegex
    default: "(?i)(wazuh|ossec|sysmon|eventlog|powershell|winrm|remote)"

sources:
  - name: SuspiciousProcesses
    query: |
      SELECT Pid, Ppid, Name, Exe, CommandLine, Username, CreateTime
      FROM pslist()
      WHERE Exe =~ ProcessRegex OR CommandLine =~ ProcessRegex OR Name =~ ProcessRegex

  - name: NetworkConnections
    query: |
      SELECT Pid, Laddr, Lport, Raddr, Rport, Status, Family, Type
      FROM netstat()
      WHERE Raddr

  - name: LoggedOnUsers
    query: |
      SELECT * FROM Artifact.Windows.Sys.Users()

  - name: ServicesOfInterest
    query: |
      SELECT Name, DisplayName, State, StartMode, PathName, StartName
      FROM Artifact.Windows.System.Services()
      WHERE Name =~ ServiceRegex OR DisplayName =~ ServiceRegex OR PathName =~ ServiceRegex

  - name: ScheduledTasks
    query: |
      SELECT * FROM Artifact.Windows.System.TaskScheduler()
      WHERE Name =~ ProcessRegex OR Command =~ ProcessRegex OR Arguments =~ ProcessRegex
