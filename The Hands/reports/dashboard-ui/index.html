<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HQ Security Stack Reports</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f7f9;
      color: #14213d;
    }
    body { margin: 0; }
    header { 
      padding: 28px 36px 18px; 
      background: #ffffff; 
      border-bottom: 1px solid #d8e0e7;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .header-content { flex: 1; }
    h1 { margin: 0 0 8px; font-size: 30px; letter-spacing: 0; }
    main { max-width: 1180px; margin: 0 auto; padding: 26px; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
    .panel { background: #ffffff; border: 1px solid #d8e0e7; border-radius: 8px; padding: 18px; }
    .span-2 { grid-column: span 2; }
    .span-4 { grid-column: span 4; }
    .metric { font-size: 30px; font-weight: 750; margin-top: 8px; }
    .muted { color: #5f6f80; font-size: 14px; }
    .risk { display: inline-block; padding: 5px 10px; border-radius: 999px; font-weight: 700; }
    .risk.low { background: #d9f7e8; color: #075e39; }
    .risk.medium { background: #fff2c2; color: #705300; }
    .risk.high { background: #ffd8d8; color: #8b1a1a; }
    ul { padding-left: 20px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { border-bottom: 1px solid #e4ebf1; padding: 10px; text-align: left; vertical-align: top; }
    canvas { width: 100%; height: 220px; }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-label {
      font-size: 12px;
      font-weight: 600;
      color: #5f6f80;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    @media (max-width: 880px) {
      .grid { grid-template-columns: 1fr; }
      .span-2, .span-4 { grid-column: span 1; }
      header {
        flex-direction: column;
        gap: 16px;
      }
      .status-badge {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <h1>HQ Security Stack Reports</h1>
      <div class="muted" id="generated">Loading latest assessment...</div>
    </div>
    <div class="status-badge">
      <span class="status-label">System Status</span>
      <iframe src="https://status.home-security.uk/badge?theme=light" width="250" height="30" frameborder="0" scrolling="no"></iframe>
    </div>
  </header>
  <main class="grid">
    <section class="panel">
      <div class="muted">Risk</div>
      <div id="risk" class="metric">--</div>
    </section>
    <section class="panel">
      <div class="muted">Signals</div>
      <div id="signalCount" class="metric">--</div>
    </section>
    <section class="panel">
      <div class="muted">Services Sampled</div>
      <div id="serviceCount" class="metric">--</div>
    </section>
    <section class="panel">
      <div class="muted">Notable Events</div>
      <div id="notableCount" class="metric">--</div>
    </section>
    <section class="panel span-2">
      <h2>Signal Mix</h2>
      <canvas id="signalChart" width="540" height="220"></canvas>
    </section>
    <section class="panel span-2">
      <h2>AI Assessment</h2>
      <p id="assessment"></p>
      <h3>Recommendations</h3>
      <ul id="recommendations"></ul>
    </section>
    <section class="panel span-4">
      <h2>Service Samples</h2>
      <table>
        <thead><tr><th>Service</th><th>Lines</th><th>Files</th><th>Signals</th></tr></thead>
        <tbody id="services"></tbody>
      </table>
    </section>
    <section class="panel span-4">
      <h2>Notable Events</h2>
      <table>
        <thead><tr><th>Service</th><th>File</th><th>Message</th></tr></thead>
        <tbody id="events"></tbody>
      </table>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
