<ossec_config>
  <client>
    <server>
      <address>wazuh.hq-sec.local</address>
      <port>1514</port>
      <protocol>udp</protocol>
    </server>
    <config-profile>windows,sysmon,powershell,fim</config-profile>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
  </client>

  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>PowerShellCore/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[EventID=4688]</query>
  </localfile>
  <localfile>
    <location>Microsoft-Windows-TaskScheduler/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>System</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <syscheck>
    <disabled>no</disabled>
    <frequency>900</frequency>
    <scan_on_start>yes</scan_on_start>
    <directories check_all="yes" realtime="yes" report_changes="yes">C:\Windows\System32\drivers\etc</directories>
    <directories check_all="yes" realtime="yes" report_changes="yes">C:\Windows\System32\GroupPolicy</directories>
    <directories check_all="yes" realtime="yes" report_changes="yes">C:\Windows\System32\Tasks</directories>
    <directories check_all="yes" realtime="yes" report_changes="yes">C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Startup</directories>
    <directories check_all="yes" realtime="yes" report_changes="yes">%USERPROFILE%\Documents\WindowsPowerShell</directories>
    <directories check_all="yes" realtime="yes" report_changes="yes">%USERPROFILE%\Documents\PowerShell</directories>
    <directories check_all="yes" realtime="yes" report_changes="yes">C:\ProgramData\HQSec\PowerShellLogs</directories>
    <directories check_all="yes" realtime="yes">C:\Program Files (x86)\ossec-agent</directories>
    <directories check_all="yes" realtime="yes">C:\Program Files (x86)\Wazuh</directories>
    <directories check_all="yes" realtime="yes">C:\Program Files\Sysmon</directories>

    <windows_registry arch="both">HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Run</windows_registry>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\RunOnce</windows_registry>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\Software\Microsoft\Windows NT\CurrentVersion\Winlogon</windows_registry>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\Software\Microsoft\Windows NT\CurrentVersion\Image File Execution Options</windows_registry>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services</windows_registry>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\Software\Microsoft\Windows Defender\Exclusions</windows_registry>

    <ignore>C:\Windows\Temp</ignore>
  </syscheck>
</ossec_config>
