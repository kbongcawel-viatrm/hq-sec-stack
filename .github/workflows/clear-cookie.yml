name: Generate Clear Cookie URL

on:
  workflow_dispatch:
    inputs:
      actor_browser:
        description: 'Provide the browser type (e.g., Mozilla, Chrome, Safari)'
        required: true

jobs:
  generate_clear_cookie_url:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Generate Clear Cookie Script
        id: generate-script
        run: |
          # Define the JavaScript code
          JS_SCRIPT="javascript:void((function()%7Bvar%20a,b,c,e,f;f=0;a=document.cookie.split(%22;%20%22);for(e=0;e%3Ca.length&&a%5Be%5D;e++)%7Bf++;for(b=%22.%22+location.host;b;b=b.replace(/%5E(?:%5C.%7C%5B%5E%5C.%5D+%5C.)/,%22%22))%7Bfor(c=location.pathname;c;c=c.replace(/.$/,%22%22))%7Bdocument.cookie=(a%5Be%5D+%22;%20domain=%22+b+%22;%20path=%22+c+%22;%20expires=%22+new%20Date((new%20Date()).getTime()-1e11).toGMTString());%7D%7D%7Dalert(%22Cleared%20%22+f+%22%20cookies%22);%7D)())"

          # Encode input for browser detection (optional, for dynamic purposes)
          BROWSER="${{ github.event.inputs.actor_browser }}"
          echo "Browser input provided by actor: $BROWSER"

          # Store the script as an environment variable
          echo "CLEAR_COOKIE_URL=$JS_SCRIPT" >> $GITHUB_ENV
          echo "Generated Clear Cookie Javascript URL."

      - name: Add to Build Summary
        run: |
          # Pull the generated JavaScript URL from environment
          echo "### Clear Cookies URL for Your Browser" >> $GITHUB_STEP_SUMMARY
          echo "[Click this link to clear cookies in your browser](\"${{ env.CLEAR_COOKIE_URL }}\")" >> $GITHUB_STEP_SUMMARY
          echo "Generated link added to build summary."

      - name: Log Details
        run: |
          echo "Generated Clear Cookie URL:"
          echo "${{ env.CLEAR_COOKIE_URL }}"