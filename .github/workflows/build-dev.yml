name: Build HQ Security Stack (Development)

on:
  workflow_dispatch:
    inputs:
      profiles:
        description: "Optional compose profiles"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: Validate Compose and Sync Images
    runs-on: ubuntu-latest
    environment: development

    env:
      SECSTACK_PROFILES: ${{ vars.DEV_SECSTACK_PROFILES || 'all' }}

      DOCKER_BUILDKIT: "1"
      COMPOSE_DOCKER_CLI_BUILD: "1"

      DOCKER_CACHE_PRUNE_BEFORE_PULL: "true"
      DOCKER_CACHE_PRUNE_AFTER_PULL: "true"
      DOCKER_CACHE_PRUNE_AFTER_EACH_IMAGE: "false"
      DOCKER_CACHE_IGNORE_FAILURES: "true"

      HARBOR_CACHE_HOST: ${{ vars.HARBOR_CACHE_HOST }}
      HARBOR_CACHE_USERNAME: ${{ vars.HARBORUSER }}
      HARBOR_CACHE_PASSWORD: ${{ secrets.HARBORPW }}

      HARBOR_CACHE_PROJECT_DOCKERIO: ${{ vars.HARBOR_CACHE_PROJECT_DOCKERIO }}
      HARBOR_CACHE_PROJECT_DOCKERHUB: ${{ vars.HARBOR_CACHE_PROJECT_DOCKERHUB }}
      HARBOR_CACHE_PROJECT_GHCR: ${{ vars.HARBOR_CACHE_PROJECT_GHCR }}
      HARBOR_CACHE_PROJECT_GREENBONE: ${{ vars.HARBOR_CACHE_PROJECT_GREENBONE }}
      HARBOR_CACHE_PROJECT_DEFAULT: ${{ vars.HARBOR_CACHE_PROJECT_DEFAULT }}

      HARBOR_CACHE_FALLBACK_TO_ORIGIN: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Login to Harbor
        if: env.HARBOR_CACHE_HOST != '' && env.HARBOR_CACHE_USERNAME != '' && env.HARBOR_CACHE_PASSWORD != ''
        run: |
          echo "${HARBOR_CACHE_PASSWORD}" | docker login "${HARBOR_CACHE_HOST}" \
            -u "${HARBOR_CACHE_USERNAME}" \
            --password-stdin
      
      - name: Prepare and start stack
        run: |
          cp .env.example .env 
      
      - name: Login to Harbor
        if: env.HARBOR_CACHE_HOST != '' && env.HARBOR_CACHE_USERNAME != '' && env.HARBOR_CACHE_PASSWORD != ''
        run: |
          echo "${HARBOR_CACHE_PASSWORD}" | docker login "${HARBOR_CACHE_HOST}" \
            -u "${HARBOR_CACHE_USERNAME}" \
            --password-stdin
            
      - name: Validate compose configuration
        shell: bash
        run: |
          set -eu
          set --
          for profile in ${SECSTACK_PROFILES} monitor; do
            set -- "$@" --profile "$profile"
          done
          docker compose --env-file .env -f "$COMPOSE_FILE" "$@" config
      
      - name: Validate shell scripts
        run: |
          bash -n scripts/start-stack.sh
          bash -n scripts/killswitch.sh
          bash -n "The Hands/backup/scripts/backup-volumes.sh"
          bash -n "The Hands/backup/scripts/restore-volume.sh"
          bash -n "The Shield/scanner/scripts/scan-containers.sh"
          bash -n "The Shield/vault/scripts/monthly-rotate.sh"
          
      - name: Pull artifacts
        uses: actions/download-artifact@v4
        with:
          name: docker-image-artifacts-${{ github.run_number }}
          path: artifact/*.tar.gz

      - name: Load production artifacts
        shell: bash
        run: |
          set -eu
          for artifact in downloaded-artifacts/*.tar.gz; do
            [ -e "$artifact" ] || {
              echo "No Docker artifacts found"
              exit 1
            }
            echo "Loading Docker artifact: $artifact"
            gzip -dc "$artifact" | docker load
          done
          
      - name: Prepare and start stack
        run: |
          sh scripts/start-stack.sh
          
      - name: Start compose stack for monitor validation
        run: |
          set -eu
          set --
          for profile in ${SECSTACK_PROFILES} monitor; do
            set -- "$@" --profile "$profile"
          done
          docker compose --env-file .env -f security-stack.compose.yml "$@" up -d --build --pull never --remove-orphans

      - name: Validate Uptime Kuma targets
        run: |
         docker compose --env-file .env -f security-stack.compose.yml --profile monitor run --rm --no-deps --entrypoint python uptime-kuma-sync /uptime-kuma/scripts/validate-monitors.py

     
      
