name: Dev Environment From Docker Image Artifacts

on:
  workflow_run:
    workflows:
      - Prewarm Docker Image Artifacts
    types:
      - completed

  workflow_dispatch:
    inputs:
      image_sync_run_id:
        description: Optional run ID from image-sync.yml. Leave empty to use latest successful run.
        required: false
        type: string
      secstack_profiles:
        description: Docker Compose profiles to start.
        required: false
        default: all
        type: string

permissions:
  contents: read
  actions: read

jobs:
  dev-environment:
    name: Start dev environment from image artifacts
    runs-on: ubuntu-latest

    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    env:
      COMPOSE_FILE: security-stack.compose.yml
      SECSTACK_PROFILES: ${{ github.event.inputs.secstack_profiles || 'all' }}
      IMAGE_ARTIFACT_ROOT: /root/artifacts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve image-sync run ID
        id: image-sync
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_IMAGE_SYNC_RUN_ID: ${{ github.event.inputs.image_sync_run_id }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" = "workflow_run" ]; then
            run_id="${WORKFLOW_RUN_ID}"
          elif [ -n "${INPUT_IMAGE_SYNC_RUN_ID:-}" ]; then
            run_id="${INPUT_IMAGE_SYNC_RUN_ID}"
          else
            run_id="$(gh run list \
              --workflow image-sync.yml \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')"
          fi

          if [ -z "${run_id}" ] || [ "${run_id}" = "null" ]; then
            echo "Unable to resolve an image-sync.yml run ID." >&2
            exit 1
          fi

          echo "Using image-sync run ID: ${run_id}"
          echo "run-id=${run_id}" >> "${GITHUB_OUTPUT}"

      - name: Download Docker image artifacts from image-sync.yml
        uses: actions/download-artifact@v4
        with:
          pattern: docker-images-*
          path: /root/artifacts
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ steps.image-sync.outputs.run-id }}

      - name: Show downloaded image artifacts
        run: |
          set -euo pipefail
          find "${IMAGE_ARTIFACT_ROOT}" -type f -name "*.tar.gz" -print | sort

      - name: Load Docker images from artifacts
        run: |
          set -euo pipefail

          found="false"

          while IFS= read -r artifact; do
            found="true"
            echo "Loading Docker image artifact: ${artifact}"
            gzip -dc "${artifact}" | docker load
          done < <(find "${IMAGE_ARTIFACT_ROOT}" -type f -name "*.tar.gz" | sort)

          if [ "${found}" != "true" ]; then
            echo "No Docker image artifacts were found under ${IMAGE_ARTIFACT_ROOT}." >&2
            exit 1
          fi

      - name: Show Docker images after load
        run: |
          docker image ls
          docker system df || true

      - name: Prepare dev environment file
        run: |
          set -euo pipefail
          cp .env.example .env

      - name: Validate Compose configuration
        run: |
          set -euo pipefail

          compose_args="-f ${COMPOSE_FILE}"
          for profile in ${SECSTACK_PROFILES}; do
            compose_args="${compose_args} --profile ${profile}"
          done

          docker compose ${compose_args} config >/dev/null
          docker compose ${compose_args} config --images | sort -u

      - name: Start dev stack
        env:
          SECSTACK_PROFILES: ${{ env.SECSTACK_PROFILES }}
        run: |
          set -euo pipefail
          sh scripts/start-stack.sh

      - name: Show running containers
        if: always()
        run: |
          docker ps -a || true
          docker compose -f "${COMPOSE_FILE}" ps || true

      - name: Cleanup downloaded artifacts and unused Docker resources
        if: always()
        run: |
          rm -rf "${IMAGE_ARTIFACT_ROOT}"
          docker container prune -f || true
          docker image prune -af || true
          docker volume prune -f || true
          docker builder prune -af || true
          docker system df || true
