name: Dev Environment (Load Prewarmed Images)

on:
  workflow_run:
    workflows: ["Prewarm Docker Image Artifacts"]
    types: [completed]

  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  dev:
    runs-on: ubuntu-latest

    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------
      # Download ALL batch artifacts
      # -------------------------------
      - name: Download all docker image artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: docker-images-*
          path: /tmp/artifacts
          merge-multiple: true

      - name: Show downloaded artifacts
        run: |
          echo "Artifacts:"
          find /tmp/artifacts -type f -name "*.tar.gz" -print

      # -------------------------------
      # Load Docker images
      # -------------------------------
      - name: Load Docker images
        run: |
          set -e

          count=0
          for file in $(find /tmp/artifacts -name "*.tar.gz"); do
            echo "Loading $file"
            gzip -dc "$file" | docker load
            count=$((count+1))
          done

          echo "Loaded $count images"

      - name: Verify loaded images
        run: |
          docker image ls

      # -------------------------------
      # Start dev stack
      # -------------------------------
      - name: Prepare env
        run: cp .env.example .env

      - name: Start stack
        run: |
          docker compose \
            -f security-stack.compose.yml \
            --profile all \
            up -d

      - name: Show running containers
        run: docker ps

      # -------------------------------
      # Cleanup (important for runner)
      # -------------------------------
      - name: Cleanup
        if: always()
        run: |
          rm -rf /tmp/artifacts
          docker container prune -f || true
          docker image prune -af || true
          docker volume prune -f || true
          docker builder prune -af || true
