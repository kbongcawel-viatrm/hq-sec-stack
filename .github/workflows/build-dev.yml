name: Build HQ Security Stack (Development)

on:
  workflow_dispatch:
    inputs:
      profiles:
        description: "Optional compose profiles"
        required: false
        default: ""
        type: string
  push:
    branches:
      - dev
      - develop

permissions:
  contents: read

env:
  COMPOSE_FILE: security-stack.compose.yml

jobs:
  validate:
    name: Build development stack
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 120

    env:
      SECSTACK_PROFILES: ${{ inputs.profiles || vars.DEV_SECSTACK_PROFILES || 'all' }}
      DOCKER_BUILDKIT: "1"
      COMPOSE_DOCKER_CLI_BUILD: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create environment file
        shell: bash
        run: |
          cp .env.example .env

      - name: Validate compose configuration
        shell: bash
        run: |
          set -eu
          set --
          for profile in ${SECSTACK_PROFILES} monitor; do
            set -- "$@" --profile "$profile"
          done
          docker compose --env-file .env -f "$COMPOSE_FILE" "$@" config

      - name: Docker compose build
        shell: bash
        run: |
          set -eu
          set --
          for profile in ${SECSTACK_PROFILES} monitor; do
            set -- "$@" --profile "$profile"
          done
          docker compose --env-file .env -f "$COMPOSE_FILE" "$@" config
          docker compose --env-file .env -f "$COMPOSE_FILE" "$@" build --pull never
