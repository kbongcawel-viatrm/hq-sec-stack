name: Build Security Stack (dev)

on:
  push:
    branches: ["dev"]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Compose and Scripts
    runs-on: ubuntu-latest
    environment: dev
    env:
      SECSTACK_PROFILES: ${{ vars.DEV_SECSTACK_PROFILES || 'all' }}
      BUILDKIT_CACHE_FROM: type=gha
      BUILDKIT_CACHE_TO: type=gha,mode=max
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create environment file
        env:
          CADDY_CROWDSEC_API_KEY: ${{ secrets.CADDY_CROWDSEC_API_KEY }}
        run: |
          cp .env.example .env
          tmp_env="$(mktemp)"
          while IFS= read -r line; do
            case "$line" in
              CADDY_CROWDSEC_API_KEY=*)
                printf 'CADDY_CROWDSEC_API_KEY=%s\n' "$CADDY_CROWDSEC_API_KEY"
                ;;
              *)
                printf '%s\n' "$line"
                ;;
            esac
          done < .env > "$tmp_env"
          mv "$tmp_env" .env

      - name: Report validation profile selection
        run: |
          echo "Validating profiles: ${SECSTACK_PROFILES}"

      - name: Validate compose configuration
        run: |
          set -eu
          set --
          for profile in ${SECSTACK_PROFILES}; do
            set -- "$@" --profile "$profile"
          done
          docker compose -f security-stack.compose.yml "$@" config

      - name: Validate shell scripts
        run: |
          bash -n scripts/start-stack.sh
          bash -n scripts/killswitch.sh
          bash -n "The Hands/backup/scripts/backup-volumes.sh"
          bash -n "The Hands/backup/scripts/restore-volume.sh"
          bash -n "The Shield/scanner/scripts/scan-containers.sh"
          bash -n "The Shield/vault/scripts/monthly-rotate.sh"

      - name: Pull critical profile images
        id: pull_images
        run: |
          set +e
          pull_log="$(mktemp)"
          failed=0
          services="$(docker compose -f security-stack.compose.yml --profile dns --profile secrets --profile brain config --services)"
          for service in $services; do
            echo "Pulling ${service}"
            service_log="$(mktemp)"
            if ! docker compose -f security-stack.compose.yml --profile dns --profile secrets --profile brain pull --ignore-buildable --ignore-pull-failures "$service" >"$service_log" 2>&1; then
              failed=1
            fi
            cat "$service_log" | tee -a "$pull_log"
          done
          if grep -Eqi '(pull access denied|manifest unknown|not found|denied)' "$pull_log"; then
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "pull_failed=true" >> "$GITHUB_OUTPUT"
            echo "pull_log=$pull_log" >> "$GITHUB_OUTPUT"
          else
            echo "pull_failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report missing image repositories
        if: steps.pull_images.outputs.pull_failed == 'true'
        run: |
          echo "One or more image repositories were denied or missing during pull."
          echo "Review the Pull critical profile images step for the failing image names."
          exit 1

      - name: Start compose stack for monitor validation
        if: steps.pull_images.outputs.pull_failed != 'true'
        run: |
          set -eu
          set --
          for profile in ${SECSTACK_PROFILES} monitor; do
            set -- "$@" --profile "$profile"
          done
          docker compose -f security-stack.compose.yml "$@" up -d --build --remove-orphans

      - name: Validate Uptime Kuma targets
        if: steps.pull_images.outputs.pull_failed != 'true'
        run: |
          docker compose -f security-stack.compose.yml --profile monitor run --rm --no-deps --entrypoint python uptime-kuma-sync /uptime-kuma/scripts/validate-monitors.py
