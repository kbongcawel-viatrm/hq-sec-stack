name: Build HQ Security Stack (Development)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build (images-v2-XXXX)"
        required: true
        type: string
      profiles:
        description: "Optional compose profiles"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate Compose and Sync Images
    runs-on: ubuntu-latest
    environment: dev

    env:
      SECSTACK_PROFILES: ${{ inputs.profiles || vars.DEV_SECSTACK_PROFILES || 'all' }}

      DOCKER_BUILDKIT: "1"
      COMPOSE_DOCKER_CLI_BUILD: "1"

      DOCKER_CACHE_PRUNE_BEFORE_PULL: "true"
      DOCKER_CACHE_PRUNE_AFTER_PULL: "true"
      DOCKER_CACHE_PRUNE_AFTER_EACH_IMAGE: "true"
      DOCKER_CACHE_IGNORE_FAILURES: "true"

      HARBOR_CACHE_HOST: ${{ vars.HARBOR_CACHE_HOST }}
      HARBOR_CACHE_USERNAME: ${{ vars.HARBORUSER }}
      HARBOR_CACHE_PASSWORD: ${{ secrets.HARBORPW }}

      HARBOR_CACHE_PROJECT_DOCKERIO: ${{ vars.HARBOR_CACHE_PROJECT_DOCKERIO }}
      HARBOR_CACHE_PROJECT_DOCKERHUB: ${{ vars.HARBOR_CACHE_PROJECT_DOCKERHUB }}
      HARBOR_CACHE_PROJECT_GHCR: ${{ vars.HARBOR_CACHE_PROJECT_GHCR }}
      HARBOR_CACHE_PROJECT_GREENBONE: ${{ vars.HARBOR_CACHE_PROJECT_GREENBONE }}
      HARBOR_CACHE_PROJECT_DEFAULT: ${{ vars.HARBOR_CACHE_PROJECT_DEFAULT }}

      HARBOR_CACHE_FALLBACK_TO_ORIGIN: "true"

    steps:
      - name: Checkout selected tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Report build ref
        run: |
          echo "Selected tag: ${{ inputs.tag }}"
          echo "Git ref: ${GITHUB_REF}"
          echo "Git ref name: ${GITHUB_REF_NAME}"
          echo "Commit: ${GITHUB_SHA}"
          echo "Validating profiles: ${SECSTACK_PROFILES}"
      - name: Create environment file
        env:
          CADDY_CROWDSEC_API_KEY: ${{ secrets.CADDY_CROWDSEC_API_KEY }}
        run: |
          cp .env.example .env

      - name: Login to Harbor
        if: env.HARBOR_CACHE_HOST != ''
        run: |
          echo "${HARBOR_CACHE_PASSWORD}" | docker login "${HARBOR_CACHE_HOST}" \
            -u "${HARBOR_CACHE_USERNAME}" \
            --password-stdin

      - name: Pull images from Harbor-backed compose refs
        run: |
          set -eu
          set --
          for profile in ${SECSTACK_PROFILES} monitor; do
            set -- "$@" --profile "$profile"
          done
                    
          docker compose --env-file .env -f security-stack.compose.yml "$@" config #validate config
          docker compose --env-file .env -f security-stack.compose.yml "$@" pull #pull images

      - name: Start compose stack for monitor validation
        run: |
          set -eu
          set --
          for profile in ${SECSTACK_PROFILES} monitor; do
            set -- "$@" --profile "$profile"
          done

          docker compose --env-file .env -f security-stack.compose.yml "$@" up -d --build --pull never --remove-orphans  #build
      - name: Validate Uptime Kuma targets
        run: |
          docker compose --env-file .env -f security-stack.compose.yml --profile monitor run --rm --no-deps --entrypoint python uptime-kuma-sync /uptime-kuma/scripts/validate-monitors.py
