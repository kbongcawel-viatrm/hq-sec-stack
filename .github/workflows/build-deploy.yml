name: Build and Deploy Security Stack

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Compose and Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create environment file
        run: cp .env.example .env

      - name: Validate compose configuration
        run: docker compose -f security-stack.compose.yml --profile all config

      - name: Validate shell scripts
        run: |
          bash -n scripts/start-stack.sh
          bash -n scripts/killswitch.sh
          bash -n "The Hands/backup/scripts/backup-volumes.sh"
          bash -n "The Hands/backup/scripts/restore-volume.sh"
          bash -n "The Shield/scanner/scripts/scan-containers.sh"
          bash -n "The Shield/vault/scripts/monthly-rotate.sh"

      - name: Pull critical profile images
        run: docker compose -f security-stack.compose.yml --profile dns --profile secrets --profile brain pull --ignore-buildable

  deploy:
    name: Deploy to Docker Host
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -eu
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch --all
            git checkout "${{ github.ref_name }}"
            git pull --ff-only
            cp .env.example .env.example.ci-reference
            SECSTACK_PROFILES="${{ vars.SECSTACK_PROFILES || 'dns secrets brain ops' }}" sh scripts/start-stack.sh


