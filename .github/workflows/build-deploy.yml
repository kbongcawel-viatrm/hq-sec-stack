name: Build and Deploy Security Stack

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      profiles:
        description: "Optional compose profiles to validate and deploy"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate Compose and Scripts
    runs-on: ubuntu-latest
    env:
      SECSTACK_PROFILES: ${{ inputs.profiles || 'all' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create environment file
        run: cp .env.example .env

      - name: Report validation profile selection
        run: |
          echo "Validating profiles: ${SECSTACK_PROFILES}"

      - name: Validate compose configuration
        run: |
          set -eu
          set --
          for profile in ${SECSTACK_PROFILES}; do
            set -- "$@" --profile "$profile"
          done
          docker compose -f security-stack.compose.yml "$@" config

      - name: Validate shell scripts
        run: |
          bash -n scripts/start-stack.sh
          bash -n scripts/killswitch.sh
          bash -n "The Hands/backup/scripts/backup-volumes.sh"
          bash -n "The Hands/backup/scripts/restore-volume.sh"
          bash -n "The Shield/scanner/scripts/scan-containers.sh"
          bash -n "The Shield/vault/scripts/monthly-rotate.sh"

      - name: Pull critical profile images
        run: docker compose -f security-stack.compose.yml --profile dns --profile secrets --profile brain pull --ignore-buildable

  deploy:
    name: Deploy to Docker Host
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    environment: production
    env:
      SECSTACK_PROFILES: ${{ inputs.profiles || vars.SECSTACK_PROFILES || 'dns secrets brain ops' }}
    steps:
      - name: Validate deploy settings
        run: |
          : "${DEPLOY_HOST:?DEPLOY_HOST secret is required}"
          : "${DEPLOY_USER:?DEPLOY_USER secret is required}"
          : "${DEPLOY_SSH_KEY:?DEPLOY_SSH_KEY secret is required}"
          : "${DEPLOY_PATH:?DEPLOY_PATH secret is required}"
          echo "Deploying profiles: ${SECSTACK_PROFILES}"
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          CADDY_CROWDSEC_API_KEY: ${{ secrets.CADDY_CROWDSEC_API_KEY }}
        with:
          envs: CADDY_CROWDSEC_API_KEY
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_PORT || 22 }}
          script: |
            set -eu
            : "${CADDY_CROWDSEC_API_KEY:?CADDY_CROWDSEC_API_KEY secret is required}"
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch --all
            git checkout "${{ github.ref_name }}"
            git pull --ff-only
            cp .env.example .env.example.ci-reference
            SECSTACK_PROFILES="${{ env.SECSTACK_PROFILES }}" sh scripts/start-stack.sh


