name: Sync Docker Images to Harbor

on:
  schedule:
    - cron: "0 10 * * *"
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  sync-images:
    name: Pull and Sync Docker Images
    runs-on: ubuntu-latest

    env:
      HARBOR_REGISTRY: demo.goharbor.io
      BUILD_VERSION: ${{ github.event.inputs.build_version || 'v1' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ vars.HARBORUSER }}
          password: ${{ secrets.HARBORPW }}

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Pull all images from Docker Compose
        run: |
          set -euo pipefail

          COMPOSE_FILE="security-stack.compose.yml"

          if [ ! -f "$COMPOSE_FILE" ]; then
            echo "Missing $COMPOSE_FILE"
            exit 1
          fi

          yq -r '.services[].image // empty' "$COMPOSE_FILE" | sort -u > images.txt

          if [ ! -s images.txt ]; then
            echo "No images found in $COMPOSE_FILE"
            exit 1
          fi

          echo "Images to pull:"
          cat images.txt

          while read -r IMAGE; do
            echo "Pulling $IMAGE"
            docker pull "$IMAGE"
          done < images.txt

      - name: Verify all images were pulled successfully
        run: |
          set -euo pipefail

          while read -r IMAGE; do
            echo "Verifying $IMAGE"
            docker image inspect "$IMAGE" > /dev/null
          done < images.txt

      - name: Commit synced image metadata
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add images.txt

          if git diff --cached --quiet; then
            echo "No metadata changes"
          else
            git commit -m "chore: sync docker images to Harbor [${BUILD_VERSION}]"
            git push
          fi

      - name: Create success tag
        run: |
          TAG_NAME="stable-image-tag-${BUILD_VERSION}-$(date -u +'%Y%m%d%H%M%S')"

          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"

          echo "Created tag: $TAG_NAME"
