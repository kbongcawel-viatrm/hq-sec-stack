name: Sync Docker Images to Harbor

on:
  schedule:
    - cron: "0 10 * * *"
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  validate:
    name: Validate Compose and Scripts
    runs-on: ubuntu-latest
    environment: dev
    env:
      SECSTACK_PROFILES: ${{ vars.DEV_SECSTACK_PROFILES || 'all' }}
      DOCKER_BUILDKIT: "1"
      COMPOSE_DOCKER_CLI_BUILD: "1"
      BUILDKIT_CACHE_FROM: type=gha
      BUILDKIT_CACHE_TO: type=gha,mode=max

      DOCKER_CACHE_PRUNE_BEFORE_PULL: "true"
      DOCKER_CACHE_PRUNE_AFTER_PULL: "true"

      HARBOR_CACHE_HOST: ${{ vars.HARBOR_CACHE_HOST }}
      HARBOR_CACHE_USERNAME: ${{ secrets.HARBOR_CACHE_USERNAME }}
      HARBOR_CACHE_PASSWORD: ${{ secrets.HARBOR_CACHE_PASSWORD }}

      HARBOR_CACHE_PROJECT_DOCKERIO: ${{ vars.HARBOR_CACHE_PROJECT_DOCKERIO }}
      HARBOR_CACHE_PROJECT_DOCKERHUB: ${{ vars.HARBOR_CACHE_PROJECT_DOCKERHUB }}
      HARBOR_CACHE_PROJECT_GHCR: ${{ vars.HARBOR_CACHE_PROJECT_GHCR }}
      HARBOR_CACHE_PROJECT_GREENBONE: ${{ vars.HARBOR_CACHE_PROJECT_GREENBONE }}
      HARBOR_CACHE_PROJECT_DEFAULT: ${{ vars.HARBOR_CACHE_PROJECT_DEFAULT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose configuration
        run: |
          set -eu
          set --
          for profile in ${SECSTACK_PROFILES}; do
            set -- "$@" --profile "$profile"
          done
          docker compose -f security-stack.compose.yml "$@" config

      - name: Login to Harbor
        run: |
          echo "${HARBOR_CACHE_PASSWORD}" | docker login "${HARBOR_CACHE_HOST}" \
            -u "${HARBOR_CACHE_USERNAME}" \
            --password-stdin

      - name: Warm Harbor registry cache and pull images
        run: |
          python3 scripts/python/prewarm-registry-cache.py \
            --compose-file security-stack.compose.yml \
            --profiles "${SECSTACK_PROFILES} monitor" \
            --targets-file "The Shield/scanner/targets.txt"

      - name: Create success tag
        run: |
          TAG_NAME="stable-image-tag-$(date -u +'%Y%m%d%H%M%S')"

          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"

          echo "Created tag: $TAG_NAME"
