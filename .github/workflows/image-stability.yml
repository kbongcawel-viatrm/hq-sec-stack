name: Sync Docker Images and tag repository with semantic version

on:
  schedule:
    - cron: "0 10 * * *"
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  validate:
    name: Validate Compose and Sync Images
    runs-on: ubuntu-latest
    environment: development

    env:
      SECSTACK_PROFILES: ${{ vars.DEV_SECSTACK_PROFILES || 'all' }}

      DOCKER_BUILDKIT: "1"
      COMPOSE_DOCKER_CLI_BUILD: "1"

      DOCKER_CACHE_PRUNE_BEFORE_PULL: "true"
      DOCKER_CACHE_PRUNE_AFTER_PULL: "true"
      DOCKER_CACHE_PRUNE_AFTER_EACH_IMAGE: "false"
      DOCKER_CACHE_IGNORE_FAILURES: "true"

      HARBOR_CACHE_HOST: ${{ vars.HARBOR_CACHE_HOST }}
      HARBOR_CACHE_USERNAME: ${{ vars.HARBORUSER }}
      HARBOR_CACHE_PASSWORD: ${{ secrets.HARBORPW }}

      HARBOR_CACHE_PROJECT_DOCKERIO: ${{ vars.HARBOR_CACHE_PROJECT_DOCKERIO }}
      HARBOR_CACHE_PROJECT_DOCKERHUB: ${{ vars.HARBOR_CACHE_PROJECT_DOCKERHUB }}
      HARBOR_CACHE_PROJECT_GHCR: ${{ vars.HARBOR_CACHE_PROJECT_GHCR }}
      HARBOR_CACHE_PROJECT_GREENBONE: ${{ vars.HARBOR_CACHE_PROJECT_GREENBONE }}
      HARBOR_CACHE_PROJECT_DEFAULT: ${{ vars.HARBOR_CACHE_PROJECT_DEFAULT }}

      HARBOR_CACHE_FALLBACK_TO_ORIGIN: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose configuration
        run: |
          set -eu
          set --
          for profile in ${SECSTACK_PROFILES}; do
            set -- "$@" --profile "$profile"
          done
          docker compose -f security-stack.compose.yml "$@" config

      - name: Login to Harbor
        if: env.HARBOR_CACHE_HOST != '' && env.HARBOR_CACHE_USERNAME != '' && env.HARBOR_CACHE_PASSWORD != ''
        run: |
          echo "${HARBOR_CACHE_PASSWORD}" | docker login "${HARBOR_CACHE_HOST}" \
            -u "${HARBOR_CACHE_USERNAME}" \
            --password-stdin
      
      - name: Set artifact tag
        run: |
          VERSION="$(date -u +'%Y.%m.%d')"
          BUILD="$(date -u +'%H%M%S')"
          TAG_NAME="images-v${VERSION}.${BUILD}"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          echo "DOCKER_ARTIFACT_TAG=$TAG_NAME" >> "$GITHUB_ENV"

      - name: Pull images and compress
        run: |
            python3 scripts/prewarm-registry-cache-final.py \
            --compose-file security-stack.compose.yml \
            --profiles "${SECSTACK_PROFILES} monitor" \
            --targets-file "The Shield/scanner/targets.txt"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-artifacts-${{ github.run_number }}
          path: artifact/*.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Create tag for the build
        run: |
          echo "Generated tag: ${DOCKER_ARTIFACT_TAG}

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git tag "${DOCKER_ARTIFACT_TAG}"
          git push origin "${DOCKER_ARTIFACT_TAG}"
          echo "Created tag: $${DOCKER_ARTIFACT_TAG}"

