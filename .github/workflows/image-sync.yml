name: Prewarm Docker Image Artifacts

on:
  push:
    branches: dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prewarm-batches:
    name: Prewarm ${{ matrix.batch.name }}
    runs-on: ubuntu-latest
    env:
      HARBOR_CACHE_FALLBACK_TO_ORIGIN: "true"
      HARBOR_CACHE_HOST: ${{ vars.HARBOR_CACHE_HOST }}
      HARBOR_CACHE_USERNAME: ${{ vars.HARBORUSER }}
      HARBOR_CACHE_PASSWORD: ${{ secrets.HARBORPW }}

      HARBOR_CACHE_PROJECT_DOCKERIO: ${{ vars.HARBOR_CACHE_PROJECT_DOCKERIO }}
      HARBOR_CACHE_PROJECT_DOCKERHUB: ${{ vars.HARBOR_CACHE_PROJECT_DOCKERHUB }}
      HARBOR_CACHE_PROJECT_GHCR: ${{ vars.HARBOR_CACHE_PROJECT_GHCR }}
      HARBOR_CACHE_PROJECT_GREENBONE: ${{ vars.HARBOR_CACHE_PROJECT_GREENBONE }}
      HARBOR_CACHE_PROJECT_DEFAULT: ${{ vars.HARBOR_CACHE_PROJECT_DEFAULT }}

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        batch:
          - name: small-base
            targets: |
              fluent/fluent-bit:3.2.10
              curlimages/curl:8.10.1
              coredns/coredns:1.11.3
              caddy:2.8.4-alpine
              python:3.12-alpine
              alpine:3.20
              hashicorp/vault:1.18
              aquasec/trivy:0.70.0

          - name: ops-monitoring
            targets: |
              portainer/portainer-ce:latest
              crowdsecurity/crowdsec:v1.6.3
              louislam/uptime-kuma:1.23.16
              mongo:7.0.29
              graylog/graylog-datanode:7.0.6
              graylog/graylog:7.0.6

          - name: wazuh
            targets: |
              wazuh/wazuh-indexer:4.14.4
              wazuh/wazuh-manager:4.14.4
              wazuh/wazuh-dashboard:4.14.4

          - name: network-ir
            targets: |
              jasonish/suricata:7.0
              zeek/zeek:lts
              strangebee/thehive:5.7
              #opensearchproject/opensearch:3.2.0
              ghcr.io/shuffle/shuffle-backend:latest
              ghcr.io/shuffle/shuffle-frontend:latest
              ghcr.io/shuffle/shuffle-orborus:latest
              ghcr.io/shuffle/shuffle-worker:nightly
              xboarder56/velociraptor:0.76.1
              cytopia/ansible:2.16-tools
              osquery/osquery:5.8.2-ubuntu22.04

          - name: greenbone
            targets: |
              registry.community.greenbone.net/community/vulnerability-tests:latest
              registry.community.greenbone.net/community/notus-data:latest
              vulnvision/greenbone-scap-data:latest
              registry.community.greenbone.net/community/cert-bund-data:latest
              registry.community.greenbone.net/community/dfn-cert-data:latest
              registry.community.greenbone.net/community/data-objects:latest
              registry.community.greenbone.net/community/report-formats:latest
              registry.community.greenbone.net/community/gpg-data:latest
              greenbone/redis-server:latest
              registry.community.greenbone.net/community/pg-gvm-migrator:stable
              registry.community.greenbone.net/community/pg-gvm:stable
              registry.community.greenbone.net/community/gvmd:stable
              registry.community.greenbone.net/community/gsa:stable-slim
              registry.community.greenbone.net/community/gsad:stable
              registry.community.greenbone.net/community/gvm-config:latest
              registry.community.greenbone.net/community/nginx:latest
              registry.community.greenbone.net/community/openvas-scanner:stable
              registry.community.greenbone.net/community/ospd-openvas:stable
              registry.community.greenbone.net/community/gvm-tools:latest

          #- name: ollama
          #  targets: |
          #    ollama/ollama:0.20.7

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Harbor
        if: env.HARBOR_CACHE_HOST != '' && env.HARBOR_CACHE_USERNAME != '' && env.HARBOR_CACHE_PASSWORD != ''
        run: |
          echo "${HARBOR_CACHE_PASSWORD}" | docker login "${HARBOR_CACHE_HOST}" \
            -u "${HARBOR_CACHE_USERNAME}" \
            --password-stdin

      - name: Show initial disk usage
        run: |
          df -h
          docker system df || true

      - name: Create batch targets file
        run: |
          mkdir -p .cache-targets
          cat > ".cache-targets/${{ matrix.batch.name }}.txt" <<EOF
          ${{ matrix.batch.targets }}
          EOF

          echo "Targets for ${{ matrix.batch.name }}:"
          cat ".cache-targets/${{ matrix.batch.name }}.txt"

      - name: Prewarm Docker image artifacts
        env:
          DOCKER_ARTIFACT_DIR: artifacts/${{ matrix.batch.name }}
          DOCKER_CACHE_FORCE_PULL: "true"
          DOCKER_CACHE_PRUNE_AFTER_EACH_IMAGE: "true"
          DOCKER_CACHE_PRUNE_AFTER_PULL: "true"
          DOCKER_CACHE_IGNORE_FAILURES: "false"
        run: |
          python3 scripts/prewarm-registry-cache-final.py \
            --targets-file ".cache-targets/${{ matrix.batch.name }}.txt" \
            --artifact-dir "artifacts/${{ matrix.batch.name }}"

      - name: Show generated artifacts
        if: always()
        run: |
          find artifacts -type f -name "*.tar.gz" -print || true
          du -sh artifacts || true
          df -h
          docker system df || true

      - name: Upload Docker image artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-images-${{ matrix.batch.name }}
          path: artifacts/${{ matrix.batch.name }}/*.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Final cleanup
        if: always()
        run: |
          rm -rf artifacts .cache-targets
          docker container prune -f || true
          docker image prune -af || true
          docker volume prune -f || true
          docker builder prune -af || true
          df -h
