name: Build Production Docker Artifacts

on:
  workflow_dispatch:
    inputs:
      artifact_tag:
        description: "Production artifact tag suffix, for example v1.0"
        required: true
        default: "v1.0"
      profiles:
        description: "Optional compose profiles"
        required: false
        default: ""
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  COMPOSE_FILE: security-stack.compose.yml
  CACHE_TARGETS_FILE: The Shield/scanner/targets.txt
  DOCKER_ARTIFACT_DIR: artifact
  DOCKER_CACHE_PRUNE_BEFORE_PULL: "true"
  DOCKER_CACHE_PRUNE_AFTER_PULL: "true"
  DOCKER_CACHE_PRUNE_AFTER_EACH_IMAGE: "false"
  DOCKER_CACHE_FORCE_PULL: "true"
  DOCKER_CACHE_IGNORE_FAILURES: "false"
  HARBOR_CACHE_FALLBACK_TO_ORIGIN: "true"

jobs:
  build-prd-artifacts:
    name: Build production image artifacts
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 120

    env:
      SECSTACK_PROFILES: ${{ inputs.profiles || vars.PROD_SECSTACK_PROFILES || 'all' }}
      DOCKER_BUILDKIT: "1"
      COMPOSE_DOCKER_CLI_BUILD: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set artifact tag
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            ARTIFACT_TAG="${GITHUB_REF_NAME}"
          else
            ARTIFACT_TAG="${{ github.event.inputs.artifact_tag }}"
          fi

          if [ -z "$ARTIFACT_TAG" ]; then
            ARTIFACT_TAG="v1.0"
          fi

          echo "DOCKER_ARTIFACT_TAG=$ARTIFACT_TAG" >> "$GITHUB_ENV"

      - name: Create environment file
        shell: bash
        env:
          CADDY_CROWDSEC_API_KEY: ${{ secrets.CADDY_CROWDSEC_API_KEY }}
        run: |
          cp .env.example .env
          tmp_env="$(mktemp)"
          while IFS= read -r line; do
            case "$line" in
              CADDY_CROWDSEC_API_KEY=*)
                printf 'CADDY_CROWDSEC_API_KEY=%s\n' "$CADDY_CROWDSEC_API_KEY"
                ;;
              *)
                printf '%s\n' "$line"
                ;;
            esac
          done < .env > "$tmp_env"
          mv "$tmp_env" .env

      - name: Login to Harbor cache
        if: ${{ vars.HARBOR_CACHE_HOST != '' && secrets.HARBOR_CACHE_USERNAME != '' && secrets.HARBOR_CACHE_PASSWORD != '' }}
        shell: bash
        run: |
          echo "${{ secrets.HARBOR_CACHE_PASSWORD }}" | docker login "${{ vars.HARBOR_CACHE_HOST }}" \
            -u "${{ secrets.HARBOR_CACHE_USERNAME }}" \
            --password-stdin

      - name: Validate shell scripts
        shell: bash
        run: |
          bash -n scripts/start-stack.sh
          bash -n scripts/killswitch.sh
          bash -n "The Hands/backup/scripts/backup-volumes.sh"
          bash -n "The Hands/backup/scripts/restore-volume.sh"
          bash -n "The Shield/scanner/scripts/scan-containers.sh"
          bash -n "The Shield/vault/scripts/monthly-rotate.sh"

      - name: Pull production artifacts
        uses: actions/download-artifact@v4
        with:
          name: docker-image-artifacts-prd-${{ github.run_id }}
          path: downloaded-artifacts

      - name: Load production artifacts
        shell: bash
        run: |
          set -eu
          for artifact in downloaded-artifacts/*.tar.gz; do
            [ -e "$artifact" ] || {
              echo "No Docker artifacts found"
              exit 1
            }
            echo "Loading Docker artifact: $artifact"
            gzip -dc "$artifact" | docker load
          done

      - name: Docker compose build from loaded artifacts
        shell: bash
        run: |
          set -eu
          set --
          for profile in ${SECSTACK_PROFILES}; do
            set -- "$@" --profile "$profile"
          done
          docker compose --env-file .env -f "$COMPOSE_FILE" "$@" config
          docker compose --env-file .env -f "$COMPOSE_FILE" "$@" build --pull never
          
      - name: Start compose stack for monitor validation
        run: |
          set -eu
          set --
          for profile in ${SECSTACK_PROFILES} monitor; do
            set -- "$@" --profile "$profile"
          done
          docker compose -f security-stack.compose.yml "$@" up -d --build --pull never --remove-orphans

      - name: Validate Uptime Kuma targets
        run: |
          docker compose -f security-stack.compose.yml --profile monitor run --rm --no-deps --entrypoint python uptime-kuma-sync /uptime-kuma/scripts/validate-monitors.py
