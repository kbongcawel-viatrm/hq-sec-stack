name: Build Security Stack (prd)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      profiles:
        description: "Optional compose profiles to validate and deploy"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate Compose and Scripts
    runs-on: ubuntu-latest
    env:
      SECSTACK_PROFILES: ${{ inputs.profiles || 'all' }}
      DOCKER_BUILDKIT: "1"
      COMPOSE_DOCKER_CLI_BUILD: "1"
      DOCKER_CACHE_PRUNE_BEFORE_PULL: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create environment file
        env:
          CADDY_CROWDSEC_API_KEY: ${{ secrets.CADDY_CROWDSEC_API_KEY }}
        run: |
          cp .env.example .env
          tmp_env="$(mktemp)"
          while IFS= read -r line; do
            case "$line" in
              CADDY_CROWDSEC_API_KEY=*)
                printf 'CADDY_CROWDSEC_API_KEY=%s\n' "$CADDY_CROWDSEC_API_KEY"
                ;;
              *)
                printf '%s\n' "$line"
                ;;
            esac
          done < .env > "$tmp_env"
          mv "$tmp_env" .env

      - name: Report validation profile selection
        run: |
          echo "Validating profiles: ${SECSTACK_PROFILES}"

      - name: Validate compose configuration
        run: |
          set -eu
          set --
          for profile in ${SECSTACK_PROFILES}; do
            set -- "$@" --profile "$profile"
          done
          docker compose -f security-stack.compose.yml "$@" config

      - name: Validate shell scripts
        run: |
          bash -n scripts/start-stack.sh
          bash -n scripts/killswitch.sh
          bash -n "The Hands/backup/scripts/backup-volumes.sh"
          bash -n "The Hands/backup/scripts/restore-volume.sh"
          bash -n "The Shield/scanner/scripts/scan-containers.sh"
          bash -n "The Shield/vault/scripts/monthly-rotate.sh"

      - name: Warm registry cache and pull images
        run: |
          python3 scripts/prewarm-registry-cache.py --compose-file security-stack.compose.yml --profiles "dns secrets brain" --targets-file "The Shield/scanner/targets.txt"

  deploy:
    name: Deploy to Docker Host
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    environment: prod
    env:
      SECSTACK_PROFILES: ${{ inputs.profiles || vars.PROD_SECSTACK_PROFILES || 'dns secrets brain ops' }}
      DOCKER_BUILDKIT: "1"
      COMPOSE_DOCKER_CLI_BUILD: "1"
    steps:
      - name: Validate deploy settings
        run: |
          : "${DEPLOY_HOST:?DEPLOY_HOST secret is required}"
          : "${DEPLOY_USER:?DEPLOY_USER secret is required}"
          : "${DEPLOY_SSH_KEY:?DEPLOY_SSH_KEY secret is required}"
          : "${DEPLOY_PATH:?DEPLOY_PATH secret is required}"
          echo "Deploying profiles: ${SECSTACK_PROFILES}"
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          CADDY_CROWDSEC_API_KEY: ${{ secrets.CADDY_CROWDSEC_API_KEY }}
        with:
          envs: CADDY_CROWDSEC_API_KEY
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_PORT || 22 }}
          script: |
            set -eu
            : "${CADDY_CROWDSEC_API_KEY:?CADDY_CROWDSEC_API_KEY secret is required}"
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch --all
            git checkout "${{ github.ref_name }}"
            git pull --ff-only
            cp .env.example .env.example.ci-reference
            tmp_env="$(mktemp)"
            while IFS= read -r line; do
              case "$line" in
                CADDY_CROWDSEC_API_KEY=*)
                  printf 'CADDY_CROWDSEC_API_KEY=%s\n' "$CADDY_CROWDSEC_API_KEY"
                  ;;
                *)
                  printf '%s\n' "$line"
                  ;;
              esac
            done < .env.example > "$tmp_env"
            mv "$tmp_env" .env
            DOCKER_CACHE_PRUNE_BEFORE_PULL=true SECSTACK_PROFILES="${{ env.SECSTACK_PROFILES }}" sh scripts/start-stack.sh


