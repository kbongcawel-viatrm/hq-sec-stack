services:
  ossec-server:
    image: ${OSSEC_IMAGE:-atomicorp/ossec-docker:v3.6}
    container_name: ${OSSEC_CONTAINER_NAME:-ossec-server}
    restart: unless-stopped
    depends_on:
      - postfix-relay
    ports:
      - "1514:1514/udp"
      - "1515:1515/tcp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ${OSSEC_DATA_DIR:-./data}
        target: /var/ossec/data

  postfix-relay:
    image: ${POSTFIX_IMAGE:-juanluisbaptiste/postfix:latest}
    container_name: ${POSTFIX_CONTAINER_NAME:-postfix-relay}
    restart: unless-stopped
    environment:
      SMTP_SERVER: ${SMTP_SERVER:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-dummykevin08@gmail.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-CHANGE_ME_GMAIL_APP_PASSWORD}
      SERVER_HOSTNAME: ${POSTFIX_SERVER_HOSTNAME:-ossec-relay.local}
